name: CarGauge CI
run-name: ${{ inputs.master_id && format('Master {0}', inputs.master_id) || github.event.head_commit.message || github.ref_name }}

on:
  push:
    branches-ignore: [ci/macos-runner-audit]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Installed iOS runtime (e.g. iOS-26-5). Empty selects an available iPhone."
        required: false
        type: string
      macos_runner:
        description: "Standard hosted macOS runner"
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-26-intel
      device_only:
        description: "Compile unsigned iPhone Release only (skip XCTest and IPA)"
        type: boolean
        default: false
      master_id:
        description: "Master device build request ID"
        type: string
      master_sha:
        description: "Exact CarGauge source commit"
        type: string
      master_flavor:
        description: "Device build flavor"
        type: choice
        options: [both, basic, full]
        default: both
      master_repeat:
        description: "Run a second build in the same checkout and DerivedData"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cargauge-ci-${{ github.workflow }}-${{ inputs.master_id || github.ref }}${{ (inputs.device_only || inputs.macos_runner == 'macos-26-intel') && '-lab' || '' }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ !inputs.master_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.2.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Swift core
        shell: bash
        run: |
          mkdir -p .artifacts/core
          {
            swift test
            for scenario in warmup overheat noVoltagePID disconnect reconnect missingCoolant invalidCoolant hangingAdapter engineOff; do
              swift run cargauge-simulator "$scenario"
            done
          } 2>&1 | tee .artifacts/core/CarGauge-Core.log
      - name: Upload core diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-Core-diagnostics
          path: .artifacts/core/CarGauge-Core.log
          include-hidden-files: true
          retention-days: 14

  master-device:
    name: Master device (${{ matrix.flavor }})
    if: ${{ inputs.master_id != '' }}
    runs-on: macos-26
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        flavor: ${{ fromJSON(inputs.master_flavor == 'basic' && '["basic"]' || inputs.master_flavor == 'full' && '["full"]' || '["basic", "full"]') }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      REQUEST_ID: ${{ inputs.master_id }}
      SOURCE_SHA: ${{ inputs.master_sha }}
      BUILD_FLAVOR: ${{ matrix.flavor }}
    steps:
      - name: Validate request
        shell: bash
        run: |
          [[ "$REQUEST_ID" =~ ^[0-9a-f]{32}$ && "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out build tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check out CarGauge source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: source
          ref: ${{ inputs.master_sha }}
          persist-credentials: false
      - name: Install pinned XcodeGen
        shell: bash
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          tool_dir="$RUNNER_TEMP/master-xcodegen"
          mkdir "$tool_dir"
          curl -fsSL --connect-timeout 6 --max-time 90 -o "$tool_dir/xcodegen.zip" \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.44.1/xcodegen.zip
          cd "$tool_dir"
          printf '%s\n' 'a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73  xcodegen.zip' | shasum -a 256 -c -
          unzip -q xcodegen.zip
          echo "$tool_dir/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build cold
        run: python3 -B scripts/master-device.py source "$BUILD_FLAVOR" cold
      - name: Upload cold
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Master-CarGauge-${{ matrix.flavor }}-cold
          path: source/.artifacts/master-device/${{ matrix.flavor }}/cold/export/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Build warm
        if: ${{ inputs.master_repeat }}
        run: python3 -B scripts/master-device.py source "$BUILD_FLAVOR" warm
      - name: Upload warm
        if: ${{ inputs.master_repeat }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Master-CarGauge-${{ matrix.flavor }}-warm
          path: source/.artifacts/master-device/${{ matrix.flavor }}/warm/export/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Master-CarGauge-${{ matrix.flavor }}-failed
          path: source/.artifacts/master-device/${{ matrix.flavor }}/*/export/build.log
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  ios:
    name: iOS (${{ matrix.flavor }})
    needs: core
    runs-on: ${{ inputs.macos_runner == 'macos-26-intel' && 'macos-26-intel' || 'macos-26' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, basic]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGAUGE_IOS_RUNTIME: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Test on an iPhone simulator and build for iPhone
        if: ${{ !inputs.device_only }}
        run: scripts/ci-ios.sh ${{ matrix.flavor }}
      - name: Compile unsigned for iPhone (no XCTest or IPA)
        if: ${{ inputs.device_only }}
        run: scripts/ci-ios.sh ${{ matrix.flavor }} --device-only
      - name: Upload iOS diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-iOS-${{ matrix.flavor }}-diagnostics
          path: |
            .artifacts/ios.*/*.log
            .artifacts/ios.*/CarGauge-UI*.xcresult
            .artifacts/ios.*/CarGauge-Device.xcresult
            .artifacts/ios.*/CarGauge-Release*.xcresult
            .artifacts/ios.*/screenshots
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Upload named usability screenshots
        if: ${{ !cancelled() && !inputs.device_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-iPhone11-${{ matrix.flavor }}-screenshots
          path: .artifacts/ios.*/gallery/*.png
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Stage the validated IPA for release
        if: ${{ success() && !inputs.device_only && inputs.macos_runner != 'macos-26-intel' && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && (github.ref == 'refs/heads/release/0.3.0-rc' || github.ref == 'refs/heads/release/0.4.0' || github.ref == 'refs/heads/release/0.4.1' || github.ref == 'refs/heads/release/0.5.0' || github.ref == 'refs/heads/release/0.6.0'))) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-${{ matrix.flavor }}-candidate
          path: |
            .artifacts/ios.*/*.ipa
            .artifacts/ios.*/*.ipa.sha256
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish-ipa:
    name: Publish Basic and Full IPA
    needs: ios
    if: ${{ success() && !inputs.device_only && inputs.macos_runner != 'macos-26-intel' && (github.ref == 'refs/heads/main' || (github.event_name == 'push' && (github.ref == 'refs/heads/release/0.3.0-rc' || github.ref == 'refs/heads/release/0.4.0' || github.ref == 'refs/heads/release/0.4.1' || github.ref == 'refs/heads/release/0.5.0' || github.ref == 'refs/heads/release/0.6.0'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: CarGauge-*-candidate
          path: candidates
      - name: Verify both checksums
        run: |
          (cd candidates/CarGauge-basic-candidate/ios.* && sha256sum --check ./*.sha256)
          (cd candidates/CarGauge-full-candidate/ios.* && sha256sum --check ./*.sha256)
      - name: Publish the Basic IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-basic-IPA
          path: candidates/CarGauge-basic-candidate/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Publish the Full IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-full-IPA
          path: candidates/CarGauge-full-candidate/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
