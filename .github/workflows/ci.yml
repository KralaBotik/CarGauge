name: CarGauge CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Installed iOS runtime (e.g. iOS-26-5). Empty selects an available iPhone."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cargauge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.2.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y --no-install-recommends libsqlite3-dev
      - name: Test Swift core
        shell: bash
        run: |
          mkdir -p .artifacts/core
          {
            swift test
            for scenario in warmup overheat noVoltagePID disconnect reconnect missingCoolant invalidCoolant hangingAdapter engineOff; do
              swift run cargauge-simulator "$scenario"
            done
          } 2>&1 | tee .artifacts/core/CarGauge-Core.log
      - name: Upload core diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-Core-diagnostics
          path: .artifacts/core/CarGauge-Core.log
          include-hidden-files: true
          retention-days: 14

  ios:
    name: iOS Simulator and device build
    needs: core
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGAUGE_IOS_RUNTIME: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Test on an iPhone simulator and build for iPhone
        run: scripts/ci-ios.sh full
      - name: Upload iOS diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-iOS-diagnostics
          path: |
            .artifacts/ios.*/*.log
            .artifacts/ios.*/CarGauge-UI*.xcresult
            .artifacts/ios.*/CarGauge-Device.xcresult
            .artifacts/ios.*/CarGauge-Release*.xcresult
            .artifacts/ios.*/screenshots
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Upload named usability screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-iPhone11-screenshots
          path: .artifacts/ios.*/gallery/*.png
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Publish CarGauge.ipa
        if: ${{ success() && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/monitoring-maintenance-0.9.0') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-IPA
          path: |
            .artifacts/ios.*/CarGauge.ipa
            .artifacts/ios.*/CarGauge.ipa.sha256
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
