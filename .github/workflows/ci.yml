name: CarGauge CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Installed iOS runtime (e.g. iOS-26-5). Empty selects an available iPhone."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cargauge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: swift:6.2.3-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Swift core
        shell: bash
        run: |
          mkdir -p .artifacts/core
          {
            swift test
            swift run cargauge-simulator overheat
          } 2>&1 | tee .artifacts/core/CarGauge-Core.log
      - name: Upload core diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-Core-diagnostics
          path: .artifacts/core/CarGauge-Core.log
          include-hidden-files: true
          retention-days: 14

  ios:
    name: iOS (${{ matrix.flavor }})
    needs: core
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, basic]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      CARGAUGE_IOS_RUNTIME: ${{ inputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          xcodegen --version
      - name: Test on an iPhone simulator and build for iPhone
        run: scripts/ci-ios.sh ${{ matrix.flavor }}
      - name: Upload iOS diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-iOS-${{ matrix.flavor }}-diagnostics
          path: |
            .artifacts/ios.*/*.log
            .artifacts/ios.*/CarGauge-UI.xcresult
            .artifacts/ios.*/CarGauge-Device.xcresult
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
      - name: Upload validated unsigned IPA and checksum
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CarGauge-${{ matrix.flavor }}-IPA
          path: |
            .artifacts/ios.*/*.ipa
            .artifacts/ios.*/*.ipa.sha256
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
