name: CarGauge
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CARGAUGE_BUNDLE_ID: com.cargauge.prototype
    CARGAUGE_APP_GROUP: group.$(CARGAUGE_BUNDLE_ID)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CarGaugePackage:
    path: .
targets:
  CarGauge:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PrivacyInfo.xcprivacy]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARGAUGE_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - package: CarGaugePackage
        product: CarGaugeCore
      - target: CarGaugeWidgets
        embed: true
        codeSign: true
  CarGaugeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARGAUGE_BUNDLE_ID).widgets
        INFOPLIST_FILE: Config/Widget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: CarGaugePackage
        product: CarGaugeCore
  CarGaugeBasic:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [PrivacyInfo.xcprivacy, TelemetryPresentation.swift]
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Basic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARGAUGE_BUNDLE_ID).basic
        INFOPLIST_FILE: Config/Basic-Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CARGAUGE_BASIC"
    dependencies:
      - package: CarGaugePackage
        product: CarGaugeCore
  CarGaugeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARGAUGE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CarGauge
    dependencies:
      - target: CarGauge
  CarGaugeBasicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CARGAUGE_BUNDLE_ID).basic.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CarGaugeBasic
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) CARGAUGE_BASIC"
    dependencies:
      - target: CarGaugeBasic
schemes:
  CarGauge:
    build:
      targets:
        CarGauge: all
        CarGaugeUITests: [test]
    test:
      config: Debug
      targets: [CarGaugeUITests]
  CarGaugeBasic:
    build:
      targets:
        CarGaugeBasic: all
        CarGaugeBasicUITests: [test]
    test:
      config: Debug
      targets: [CarGaugeBasicUITests]
